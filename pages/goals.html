        <!-- =========================
             MAIN CONTENT
        ========================== -->

    <main class="main-content">

        <div class="page-header">

            <div>

                <h1>Goals</h1>

                <p>
                    Track your savings goals.
                </p>

            </div>

            <button id="add-goal-btn">
                + Add Goal
            </button>

        </div>

        <!-- Goal Statistics -->

        <div class="goal-stats">

            <div class="stat-card">

                <span>🎯</span>

                <div>
                    <small>Total Goals</small>

                    <strong id="total-goals">0</strong>
                </div>

            </div>


            <div class="stat-card">

                <span>💰</span>

                <div>
                    <small>Total Target</small>

                    <strong id="total-target">₹0</strong>
                </div>

            </div>


            <div class="stat-card">

                <span>💵</span>

                <div>
                    <small>Total Saved</small>

                    <strong id="total-saved">₹0</strong>
                </div>

            </div>


            <div class="stat-card">

                <span>🎉</span>

                <div>
                    <small>Completed</small>

                    <strong id="completed-goals">0</strong>
                </div>

            </div>

        </div>

       
        <div class="goal-tools">

            <div class="goal-search">

                <input
                    type="text"
                    id="search-goals"
                    placeholder="🔍 Search goals..."
                >

            </div>


            <select id="sort-goals">

                <option value="default">
                    Sort Goals
                </option>

                <option value="date">
                    Target Date
                </option>

                <option value="target-high">
                    Highest Target Amount
                </option>

                <option value="saved-high">
                    Highest Saved Amount
                </option>

                <option value="percentage">
                    Highest Completion
                </option>

                 <option value="remaining-low">
                    Remaining Amount: Low to High
                </option>

                <option value="remaining-high">
                    Remaining Amount: High to Low
                </option>
                <option value="completed-first">
                    Completed Goals First
                </option>
                <option value="in-progress-first">
                    In Progress Goals First
                </option>

            </select>

           <!-- Filter Goals -->

            <select id="filter-goals">

                <option value="all">
                    All Goals
                </option>

                <option value="in-progress">
                    In Progress
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>
            <button
                type="button"
                id="reset-goals-btn"
            >
                Reset
            </button>

        </div>
        


        <!-- Goal Form -->

        <div
            class="form-container"
            id="goal-form-container"
            style="display: none;">

            <h2>Add Savings Goal</h2>

            <form id="goal-form">

                <div class="form-group">

                    <label for="goal-name">
                        Goal Name
                    </label>

                    <input
                        type="text"
                        id="goal-name"
                        placeholder="e.g. Vacation Trip"
                        required>

                </div>
                <div class="form-group">

                    <label for="goal-icon">
                        Goal Icon
                    </label>

                    <select id="goal-icon">

                        <option value="🎯">🎯 General Goal</option>

                        <option value="💻">💻 Laptop</option>

                        <option value="✈️">✈️ Travel</option>

                        <option value="🚗">🚗 Car</option>

                        <option value="🏠">🏠 House</option>

                        <option value="🎓">🎓 Education</option>

                        <option value="💰">💰 Savings</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="target-amount">
                        Target Amount
                    </label>

                    <input
                        type="number"
                        id="target-amount"
                        min="1"
                        step="0.01"
                        placeholder="Enter target amount"
                        required>

                </div>


                <div class="form-group">

                    <label for="saved-amount">
                        Saved Amount
                    </label>

                    <input
                        type="number"
                        id="saved-amount"
                        min="0"
                        step="0.01"
                        value="0"
                        required>

                </div>


                <div class="form-group">

                    <label for="target-date">
                        Target Date
                    </label>

                    <input
                        type="date"
                        id="target-date"
                        required>

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        id="cancel-goal-btn">

                        Cancel

                    </button>

                    <button type="submit">

                        Add Goal

                    </button>

                </div>

            </form>

        </div>

   <p id="goals-count"></p>
        <!-- Goals List -->

        <div
            id="goals-list"
            class="goals-list">
        </div>

    </main>
