<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FinTrack - Transactions</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

    <!-- Logo -->

    <div class="logo">

        <div class="logo-icon">
            📊
        </div>

        <h2>FinTrack</h2>

    </div>


    <!-- Navigation -->

    <nav class="sidebar-nav">

        <a href="./dashboard.html" class="nav-link">
            <span class="nav-icon">⌂</span>
            <span>Dashboard</span>
        </a>


        <a href="./transactions.html" class="nav-link">
            <span class="nav-icon">↔</span>
            <span>Transactions</span>
        </a>


        <a href="./income.html" class="nav-link">
            <span class="nav-icon">↑</span>
            <span>Income</span>
        </a>


        <a href="./expenses.html" class="nav-link">
            <span class="nav-icon">↓</span>
            <span>Expenses</span>
        </a>


        <a href="./budgets.html" class="nav-link">
            <span class="nav-icon">▣</span>
            <span>Budgets</span>
        </a>


        <a href="./goals.html" class="nav-link">
            <span class="nav-icon">◎</span>
            <span>Goals</span>
        </a>


        <a href="./recurring.html" class="nav-link">
            <span class="nav-icon">↻</span>
            <span>Recurring</span>
        </a>


        <a href="./reports.html" class="nav-link">
            <span class="nav-icon">▥</span>
            <span>Reports</span>
        </a>


        <a href="./categories.html" class="nav-link">
            <span class="nav-icon">▦</span>
            <span>Categories</span>
        </a>


        <a href="./import-export.html" class="nav-link">
            <span class="nav-icon">⇅</span>
            <span>Import / Export</span>
        </a>


        <a href="./settings.html" class="nav-link">
            <span class="nav-icon">⚙</span>
            <span>Settings</span>
        </a>

    </nav>

</aside>


        <!-- Main Content -->

        <main class="main-content">

            <div class="page-header">

                <div>
                    <h1>Transactions</h1>

                    <p>
                        Manage all your income and expenses.
                    </p>
                </div>

                <a
                    href="./add-transaction.html"
                    class="add-transaction-btn"
                >
                    + Add Transaction
                </a>

            </div>


            <!-- Filters -->

            <div class="transaction-filters">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search transactions..."
                >

                <select id="type-filter">

                    <option value="all">
                        All Transactions
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expenses
                    </option>

                </select>

                <select id="category-filter">

                    <option value="all">
                        All Categories
                    </option>

                </select>

            </div>


            <!-- Transactions Table -->

            <div class="transactions-card">

                <table>

                    <thead>

                        <tr>
                            <th>Date</th>
                            <th>Transaction</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="transactions-table-body">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="../js/utils/theme.js"></script>

   <script src="../js/utils/sidebar.js"></script>

    <script
        type="module"
        src="../js/pages/transactions.js"
    ></script>

</body>

</html>
