<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FinTrack - Budgets</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>


<body>

    <div class="app-layout">


        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    📊
                </div>

                <h2>FinTrack</h2>

            </div>


            <nav class="sidebar-nav">

                <a href="./dashboard.html" class="nav-link">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>

                <a href="./transactions.html" class="nav-link">
                    <span class="nav-icon">↔</span>
                    <span>Transactions</span>
                </a>

                <a href="./income.html" class="nav-link">
                    <span class="nav-icon">↑</span>
                    <span>Income</span>
                </a>

                <a href="./expenses.html" class="nav-link">
                    <span class="nav-icon">↓</span>
                    <span>Expenses</span>
                </a>

                <a href="./budgets.html" class="nav-link">
                    <span class="nav-icon">▣</span>
                    <span>Budgets</span>
                </a>

                <a href="./goals.html" class="nav-link">
                    <span class="nav-icon">◎</span>
                    <span>Goals</span>
                </a>

                <a href="./recurring.html" class="nav-link">
                    <span class="nav-icon">↻</span>
                    <span>Recurring</span>
                </a>

                <a href="./reports.html" class="nav-link">
                    <span class="nav-icon">▥</span>
                    <span>Reports</span>
                </a>

                <a href="./categories.html" class="nav-link">
                    <span class="nav-icon">▦</span>
                    <span>Categories</span>
                </a>

                <a href="./import-export.html" class="nav-link">
                    <span class="nav-icon">⇅</span>
                    <span>Import / Export</span>
                </a>

                <a href="./settings.html" class="nav-link">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </a>

            </nav>

        </aside>


        <!-- Main Content -->

        <main class="main-content">


            <!-- Page Header -->

            <div class="page-header">

                <div>

                    <h1>Budgets</h1>

                    <p>
                        Plan and control your monthly spending.
                    </p>

                </div>


                <button
                    class="add-transaction-btn"
                    id="add-budget-btn"
                >
                    + Add Budget
                </button>

            </div>



            <!-- Budget Summary -->

            <div class="summary-cards">


                <div class="summary-card">

                    <div class="card-icon balance-icon">
                        ₹
                    </div>

                    <div class="card-content">

                        <p>Total Budget</p>

                        <h3 id="total-budget">
                            ₹0
                        </h3>

                    </div>

                </div>


                <div class="summary-card">

                    <div class="card-icon expense-icon">
                        ₹
                    </div>

                    <div class="card-content">

                        <p>Total Spent</p>

                        <h3 id="total-spent">
                            ₹0
                        </h3>

                    </div>

                </div>


                <div class="summary-card">

                    <div class="card-icon savings-icon">
                        ₹
                    </div>

                    <div class="card-content">

                        <p>Remaining Budget</p>

                        <h3 id="remaining-budget">
                            ₹0
                        </h3>

                    </div>

                </div>


            </div>



            <!-- Budget List -->

            <div
                class="budgets-page-list"
                id="budgets-page-list"
            >

            </div>



            <!-- Add Budget Modal -->

            <div
                class="modal"
                id="budget-modal"
            >

                <div class="modal-content">


                    <div class="modal-header">

                        <h2>
                            Add Budget
                        </h2>

                        <button
                            class="close-modal"
                            id="close-budget-modal"
                        >
                            ×
                        </button>

                    </div>


                    <form id="budget-form">


                        <div class="form-group">

                            <label for="budget-category">
                                Category
                            </label>

                            <select
                                id="budget-category"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Food & Dining">
                                    Food & Dining
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Shopping">
                                    Shopping
                                </option>

                                <option value="Utilities">
                                    Utilities
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Health">
                                    Health
                                </option>

                                <option value="Others">
                                    Others
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="budget-amount">
                                Budget Amount
                            </label>

                            <input
                                type="number"
                                id="budget-amount"
                                placeholder="Enter budget amount"
                                min="1"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="add-transaction-btn"
                        >
                            Save Budget
                        </button>


                    </form>

                </div>

            </div>


        </main>

    </div>

    <script src="../js/utils/theme.js"></script>
    <script src="../js/utils/sidebar.js"></script>



    <script
        type="module"
        src="../js/pages/budgets.js"
    ></script>

</body>

</html>
