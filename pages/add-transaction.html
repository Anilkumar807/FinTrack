<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FinTrack - Add Transaction</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>


<body>

    <main class="main-content">

        <div class="form-container">

            <h1>Add Transaction</h1>

            <p>
                Add a new income or expense.
            </p>


            <form id="transaction-form">

                <!-- Transaction Type -->

                <div class="form-group">

                    <label for="type">
                        Transaction Type
                    </label>

                    <select id="type" required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                </div>


                <!-- Title -->

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Salary"
                        required
                    >

                </div>


                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Income">
                            Income
                        </option>

                        <option value="Food & Dining">
                            Food & Dining
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Utilities">
                            Utilities
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Others">
                            Others
                        </option>

                    </select>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <!-- Buttons -->

                <div class="form-actions">

                    <button
                        type="button"
                        onclick="history.back()"
                    >
                        Cancel
                    </button>

                    <button type="submit">
                        Add Transaction
                    </button>

                </div>

            </form>

        </div>

    </main>


    <script
        type="module"
        src="../js/pages/addTransaction.js">
    </script>

</body>

</html>
