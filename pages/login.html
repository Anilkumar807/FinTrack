<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - FinTrack
    </title>


    <link
        rel="stylesheet"
        href="../css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >
    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <!-- Left Side -->

            <div class="login-info">

                <div class="login-logo">

                    <span class="logo-icon">
                        📊
                    </span>
                    <h1>
                        FinTrack
                    </h1>
                </div>
                <h2>
                    Take Control of Your Money.
                </h2>
                <h3>
                    Better Future.
                </h3>
                <p>
                    Track your income, expenses,
                    budgets and savings goals in one place.
                </p>
                <div class="login-features">
                    <div>
                        🛡️ Secure & Private
                    </div>
                    <div>
                        📊 Smart Financial Insights
                    </div>
                    <div>
                        🎯 Achieve Your Goals
                    </div>
                </div>
            </div>
            <!-- Right Side -->
            <div class="login-form-section">
                <div class="login-form-container">
                    <h2>
                        Welcome Back! 👋
                    </h2>
                    <p>
                        Login to manage your finances.
                    </p>
                    <form id="login-form">
                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>
                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>
                        <div class="form-group">
                            <label for="password">
                                Password
                            </label>
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >
                        </div>
                        <div class="login-options">

                            <label>

                                <input
                                    type="checkbox"
                                    id="remember-me"
                                >
                                Remember me
                            </label>
                            <a href="#">
                                Forgot Password?
                            </a>
                        </div>
                        <button
                            type="submit"
                            class="login-btn"
                        >
                            Login
                        </button>
                    </form>
                    <p class="signup-text">

                        Don't have an account?

                       <a href="signup.html">
                            Sign Up
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script
        type="module"
        src="../js/pages/login.js"
    ></script>
</body>

</html>
